# fly.toml app configuration file generated for mongo-fly on 2026-04-12T15:54:41+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mongo-fly'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 27017
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "mongo_data"
  destination = "/data/db"